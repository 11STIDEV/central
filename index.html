<!doctype html>
<html lang="pt-BR" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-cci-azul.png" />
    <!-- Em produção o Node substitui `content` se CENTRAL_API_BASE_URL estiver definida (veja server/index.js) -->
    <meta name="central-api-base" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Central de Informações · Grupo CCI</title>
    <meta
      name="description"
      content="Intranet do Grupo CCI — chamados, agenda, documentos e ferramentas internas."
    />
    <meta property="og:title" content="Central de Informações · Grupo CCI" />
    <meta
      property="og:description"
      content="Intranet do Grupo CCI — chamados, agenda, documentos e ferramentas internas."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
  </head>

  <body>
    <script>
      window.addEventListener('error', function(e) {
        var msg = (e.message || e.error || e || '').toString();
        if (msg.includes('ResizeObserver') || msg.includes('aborted') || msg.includes('AbortError')) return;
        var d = document.getElementById('debug-error-box');
        if (!d) {
          d = document.createElement('div');
          d.id = 'debug-error-box';
          d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#dc2626;color:white;padding:16px;z-index:999999;font-family:monospace;font-size:13px;white-space:pre-wrap;box-shadow:0 4px 6px rgba(0,0,0,0.2);';
          document.body.appendChild(d);
        }
        d.textContent = '⚠️ [Erro no Navegador]: ' + msg + '\nEm: ' + (e.filename || '') + ':' + (e.lineno || '');
      });
      window.addEventListener('unhandledrejection', function(e) {
        var reason = (e.reason && (e.reason.stack || e.reason.message)) || e.reason || '';
        var msg = String(reason);
        if (
          msg.includes('aborted') ||
          msg.includes('AbortError') ||
          msg.includes('ResizeObserver') ||
          msg.includes('canceled') ||
          msg.includes('cancelled')
        ) {
          return;
        }
        var d = document.getElementById('debug-error-box');
        if (!d) {
          d = document.createElement('div');
          d.id = 'debug-error-box';
          d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#b45309;color:white;padding:16px;z-index:999999;font-family:monospace;font-size:13px;white-space:pre-wrap;box-shadow:0 4px 6px rgba(0,0,0,0.2);';
          document.body.appendChild(d);
        }
        d.textContent = '⚠️ [Promise Rejeitada]: ' + msg;
      });

      // Ativa console DevTools (Eruda) no celular quando a URL contiver ?debug=1 ou ?logs=1
      if (
        window.location.search.includes('debug=1') ||
        window.location.search.includes('logs=1') ||
        window.location.search.includes('eruda=1') ||
        localStorage.getItem('debug_logs') === 'true'
      ) {
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/eruda';
        s.onload = function() {
          if (window.eruda) window.eruda.init();
        };
        document.head.appendChild(s);
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
